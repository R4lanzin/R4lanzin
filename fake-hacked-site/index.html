<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hacked</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    background: #ffffff;
    font-family: 'Courier New', Consolas, monospace;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
    gap: 28px;
  }

  .face {
    width: clamp(140px, 30vw, 220px);
    height: auto;
  }

  .signature {
    font-size: clamp(18px, 4vw, 30px);
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #cc0000;
    font-weight: bold;
  }
</style>
</head>
<body>

<svg class="face" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <circle cx="100" cy="100" r="80" fill="none" stroke="#cc0000" stroke-width="9"
    stroke-linecap="round"
    stroke-dasharray="6 4 10 3 8 5 14 2 9 6 11 4 7 5 12 3"
  />
  <circle cx="70" cy="85" r="9" fill="#cc0000"/>
  <circle cx="130" cy="85" r="9" fill="#cc0000"/>
  <path d="M 55 125 Q 100 165 145 125"
    fill="none" stroke="#cc0000" stroke-width="9" stroke-linecap="round"/>
</svg>

<div class="signature">by Subsequency and Red Team</div>

</body>
</html>
